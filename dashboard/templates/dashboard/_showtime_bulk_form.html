<form id="bulk-showtime-form" class="form" hx-post="{{ form_action }}" hx-target="#drawer-content" hx-swap="innerHTML"
      x-data="bulkShowtimeForm()">
  {% csrf_token %}
  {% include "dashboard/_form_alert.html" with errors=errors %}
  <p class="formIntro">Creates a showtime at each time below, on every day from the start date to the end date.</p>
  <div class="formRow">
    <div class="formGroup"><label for="bulk-start">Start date</label>
      <input id="bulk-start" type="date" name="start_date" class="input" required value="{{ start_date }}"
             min="{{ engagement.start_date|date:'Y-m-d' }}" max="{{ engagement.end_date|date:'Y-m-d' }}" /></div>
    <div class="formGroup"><label for="bulk-end">End date</label>
      <input id="bulk-end" type="date" name="end_date" class="input" required value="{{ end_date }}"
             min="{{ engagement.start_date|date:'Y-m-d' }}" max="{{ engagement.end_date|date:'Y-m-d' }}" /></div>
  </div>
  <fieldset class="formGroup">
    <legend>Times each day</legend>
    <div class="repeatList">
      <template x-for="(t, i) in times" :key="i">
        <div class="repeatRow">
          <input type="time" class="input" required x-model="times[i]" name="times" :aria-label="'Time ' + (i + 1)" />
          <button type="button" class="btn btn-secondary btn-icon" x-show="times.length > 1" @click="remove(i)"
                  :aria-label="'Remove time ' + (i + 1)">&times;</button>
        </div>
      </template>
      <button type="button" class="repeatAdd" @click="add()">+ Add another time</button>
    </div>
  </fieldset>
  <div class="formGroup"><label for="bulk-captions">Captions<span class="fieldOptional">optional</span></label>
    <select id="bulk-captions" name="captions" class="input">
      <option value="" {% if captions == '' %}selected{% endif %}>None</option>
      <option value="CC" {% if captions == 'CC' %}selected{% endif %}>Closed Captions (CC)</option>
      <option value="OC" {% if captions == 'OC' %}selected{% endif %}>Open Captions (OC)</option>
    </select>
  </div>
</form>
<div id="drawer-footer" class="drawerFooter" hx-swap-oob="true">
  <button type="button" class="btn btn-secondary" @click="$store.drawer.close()">Cancel</button>
  <button type="submit" form="bulk-showtime-form" class="btn btn-primary">Create Showtimes</button>
</div>
