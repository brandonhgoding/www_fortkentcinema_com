<form id="showtime-form" class="form" hx-post="{{ form_action }}" hx-target="#drawer-content" hx-swap="innerHTML">
  {% csrf_token %}
  {% include "dashboard/_form_alert.html" with errors=errors %}
  <div class="formRow">
    <div class="formGroup">
      <label for="st-date">Date</label>
      <input id="st-date" type="date" name="date" class="input" required value="{{ date }}"
             min="{{ engagement.start_date|date:'Y-m-d' }}" max="{{ engagement.end_date|date:'Y-m-d' }}" />
    </div>
    <div class="formGroup">
      <label for="st-time">Time</label>
      <input id="st-time" type="time" name="time" class="input" required value="{{ time }}" />
    </div>
  </div>
  <div class="formGroup">
    <label for="st-captions">Captions<span class="fieldOptional">optional</span></label>
    <select id="st-captions" name="captions" class="input">
      <option value="" {% if captions == '' %}selected{% endif %}>None</option>
      <option value="CC" {% if captions == 'CC' %}selected{% endif %}>Closed Captions (CC)</option>
      <option value="OC" {% if captions == 'OC' %}selected{% endif %}>Open Captions (OC)</option>
    </select>
  </div>
  {% if mode == 'edit' %}
  <div class="formGroup">
    <label class="checkboxLabel" for="st-cancelled"><input id="st-cancelled" type="checkbox" name="is_cancelled" {% if is_cancelled %}checked{% endif %} /> Cancelled</label>
  </div>
  {% endif %}
</form>
<div id="drawer-footer" class="drawerFooter" hx-swap-oob="true">
  <button type="button" class="btn btn-secondary" @click="$store.drawer.close()">Cancel</button>
  <button type="submit" form="showtime-form" class="btn btn-primary">{{ submit_label }}</button>
</div>
