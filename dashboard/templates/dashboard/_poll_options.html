<div id="poll-options">
  {% for row in tallies %}
    <div class="pollOptionRow">
      <div>
        <strong>{{ row.option.film.title }}</strong>
        {% if poll.winner_id == row.option.pk %}
          <span class="pollWinnerBadge">Winner</span>
        {% endif %}
        <span class="pollTallyBar">
          <span class="pollTallyFill" style="width: {{ row.percent }}%"></span>
        </span>
      </div>
      <div>
        <span>{{ row.count }} vote{{ row.count|pluralize }}</span>
        {% if poll.status == "DRAFT" %}
          <button class="secondaryButton" aria-label="Move up"
                  hx-post="{% url 'dashboard:poll_option_move' poll.pk row.option.pk %}"
                  hx-vals='{"direction": "up"}'
                  hx-target="#poll-options" hx-swap="outerHTML">&uarr;</button>
          <button class="secondaryButton" aria-label="Move down"
                  hx-post="{% url 'dashboard:poll_option_move' poll.pk row.option.pk %}"
                  hx-vals='{"direction": "down"}'
                  hx-target="#poll-options" hx-swap="outerHTML">&darr;</button>
          <button class="secondaryButton"
                  hx-post="{% url 'dashboard:poll_option_remove' poll.pk row.option.pk %}"
                  hx-target="#poll-options" hx-swap="outerHTML">Remove</button>
        {% endif %}
      </div>
    </div>
  {% empty %}
    <p>No films on this ballot yet. Search below to add four to six.</p>
  {% endfor %}
</div>
