{% if polls %}
<table class="table" id="poll-list">
  <thead>
    <tr><th>Poll</th><th>Status</th><th>Options</th><th>Votes</th><th></th></tr>
  </thead>
  <tbody>
    {% for poll in polls %}
    <tr>
      <td>{{ poll.title }}</td>
      <td><span class="statusBadge">{{ poll.get_status_display }}</span></td>
      <td>{{ poll.options.count }}</td>
      <td>{{ poll.total_votes }}</td>
      <td>
        <button class="secondaryButton"
                hx-get="{% url 'dashboard:poll_edit' poll.pk %}"
                hx-target="#drawer-content" hx-swap="innerHTML"
                @click="drawerOpen = true">Edit</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<div class="empty-state" id="poll-list">
  <h2>No Polls Yet</h2>
  <p>Create a round, add four to six films, then open it for voting.</p>
</div>
{% endif %}
