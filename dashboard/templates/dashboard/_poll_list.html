{% if polls %}
<div class="tableWrapper" id="poll-list"{% if oob %} hx-swap-oob="true"{% endif %}>
<table class="table">
  <thead>
    <tr><th>Poll</th><th>Status</th><th>Options</th><th>Votes</th><th></th></tr>
  </thead>
  <tbody>
    {% for poll in polls %}
    <tr>
      <td>
        <a class="memberLink" href="{% url 'dashboard:poll_detail' poll.pk %}">{{ poll.title }}</a>
      </td>
      <td><span class="status-badge status-{{ poll.status|lower }}">{{ poll.get_status_display }}</span></td>
      <td>{{ poll.options.count }}</td>
      <td>{{ poll.total_votes }}</td>
      <td>
        <div class="actions">
          <button class="btn btn-secondary btn-sm"
                  hx-get="{% url 'dashboard:poll_edit' poll.pk %}"
                  hx-target="#drawer-content" hx-swap="innerHTML"
                  @click="$store.drawer.show('Edit Poll')">Edit</button>
          <button class="btn btn-danger btn-sm"
                  hx-post="{% url 'dashboard:poll_delete' poll.pk %}"
                  hx-target="#poll-list" hx-swap="outerHTML"
                  data-dashboard-confirm='{"title":"Delete Poll","message":"Delete \"{{ poll.title|escapejs }}\"? Its ballot and {{ poll.total_votes }} vote{{ poll.total_votes|pluralize }} go with it. This can\u0027t be undone.","confirmLabel":"Delete","variant":"danger"}'>Delete</button>
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<div class="empty-state" id="poll-list"{% if oob %} hx-swap-oob="true"{% endif %}>
  <h3 class="empty-state-title">No Polls Yet</h3>
  <p class="empty-state-description">Create a round, add four to six films, then open it for voting.</p>
</div>
{% endif %}
