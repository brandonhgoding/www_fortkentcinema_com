<form method="post" action="{% url 'magic_link_request' %}" class="login-form">
  {% csrf_token %}
  {% comment %} Honeypot: hidden from people, irresistible to bots. {% endcomment %}
  <div class="login-hp" aria-hidden="true">
    <label for="link-website">Website</label>
    <input type="text" name="website" id="link-website" tabindex="-1" autocomplete="off" />
  </div>
  {% if link_form.email.errors %}<div class="login-error">{{ link_form.email.errors.0 }}</div>{% endif %}
  <label class="login-label" for="id_email">Email</label>
  {{ link_form.email }}
  <button type="submit" class="btn btn-primary login-submit">Email me a sign-in link</button>
</form>
