{% load dashboard_extras %}
<form id="category-form" class="form" hx-post="{{ form_action }}" hx-target="#drawer-content" hx-swap="innerHTML">
  {% csrf_token %}
  {% include "dashboard/_form_alert.html" with errors=form.non_field_errors %}
  {% if editing %}<p class="formIntro">Renaming updates every post filed under it. The category's URL slug ({{ form.instance.slug }}) stays the same.</p>{% endif %}
  {% field form.name label="Name" %}
</form>
<div id="drawer-footer" class="drawerFooter" hx-swap-oob="true">
  <button type="button" class="btn btn-secondary" @click="$store.drawer.close()">Cancel</button>
  <button type="submit" form="category-form" class="btn btn-primary">{{ submit_label }}</button>
</div>
