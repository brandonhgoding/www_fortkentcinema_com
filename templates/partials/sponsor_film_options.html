{% comment %}
The full film <select> list, fetched on demand.

/sponsor/ renders this select with only the option that is selected (see
SponsorshipInquiryForm._defer_film_choices) — the whole list is ~1,140
options and more than half the page's HTML, and most visitors never open the
inquiry drawer at all. HTMX swaps this in as the select's innerHTML the first
time someone actually goes to pick a film.

The empty option is included because this is an innerHTML swap: it replaces
everything the server rendered, so "Not sure yet" has to come back with it.

Labels must match ModelChoiceField's, which uses str(obj) — StudioTitle.__str__
returns .title. Rendering anything else here would make the deferred list and
the ?films=all list disagree.
{% endcomment %}
<option value="">Not sure yet</option>
{% for title in titles %}<option value="{{ title.pk }}">{{ title.title }}</option>
{% endfor %}
