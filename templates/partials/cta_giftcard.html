{% load static %}
<article class="home-card gift-card-cta">
  <div class="home-card__media">
    <img src="{% static 'img/involved/pay-it-forward.jpg' %}" alt="" width="1200" height="675"
         loading="lazy" decoding="async" class="home-card__img">
  </div>
  <p class="home-card__eyebrow">Gift cards</p>
  <h3 class="home-card__title">Pay it forward</h3>
  <p class="home-card__body">An e-gift card for a night at the movies.</p>
  <a
    href="https://app.squareup.com/gift/MLWDCWWHFATH1/order"
    target="_blank"
    rel="noopener noreferrer"
    class="home-link"
    data-track="giftcard_click"
    aria-label="Buy an e-gift card (opens in new window)"
  >Buy an e-gift card &rarr;</a>
</article>
