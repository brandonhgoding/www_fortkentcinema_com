<section class="home-section home-section--accent home-membership" id="membership"
         aria-labelledby="home-membership-title">
  <div class="section-container home-membership__inner">
    <div class="home-membership__text">
      <p class="home-eyebrow">Membership</p>
      <h2 class="home-membership__title" id="home-membership-title">Become a member</h2>
      <p class="home-membership__line">Movies, perks, and a hand in keeping the marquee lit.</p>
      {% if membership_from_price is not None %}
        <p class="home-membership__price">From ${{ membership_from_price }} a year.</p>
      {% endif %}
    </div>
    <a href="{% url 'membership' %}" class="btn-member"
       data-track="membership_cta_click" data-track-location="home">Become a member</a>
  </div>
</section>
