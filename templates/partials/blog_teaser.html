<section class="blog" id="blog">
  <div class="section-container">
    <div class="section-header">
      <h2 class="section-title">BLOG</h2>
      <p class="section-subtitle">News, reviews, and updates from Fort Kent Cinema</p>
      <svg class="fx-divider" viewBox="0 0 400 40" aria-hidden="true" focusable="false">
        <path d="M 10 20 L 150 20 L 170 8 L 200 32 L 230 8 L 250 20 L 390 20" pathLength="1" />
        <circle cx="200" cy="20" r="3" />
      </svg>
    </div>

    <div class="blog-grid blog-grid-preview" data-spotlight>
      {% for post in recent_posts %}
      <a href="/blog/{{ post.slug }}" class="blog-card-link">
        {% include "partials/blog_card.html" %}
      </a>
      {% endfor %}
    </div>

    <div class="blog-view-all">
      <a href="/blog" class="blog-view-all-link">View All Posts &rarr;</a>
    </div>
  </div>
</section>
