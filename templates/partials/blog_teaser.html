<section class="blog" id="blog">
  <div class="section-container">
    <div class="section-header">
      <h2 class="section-title">BLOG</h2>
      <p class="section-subtitle">News, reviews, and updates from Fort Kent Cinema</p>
    </div>

    <div class="blog-grid blog-grid-preview" data-spotlight>
      {% for post in recent_posts %}
      <a href="/blog/{{ post.slug }}" class="blog-card-link">
        {% include "partials/blog_card.html" %}
      </a>
      {% endfor %}
    </div>

    <div class="blog-view-all">
      <a href="{% url 'blog_list' %}" class="blog-view-all-link">View All Posts &rarr;</a>
    </div>
  </div>
</section>
